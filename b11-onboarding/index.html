<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B11 Employee Onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: onboarding app — module rail on the left, one lesson screen at a time on the right, step bar under each lesson.
   Single light look on purpose, matching the light-theme welcome video. */
:root{
  --ground:#EEF2FA; --panel:#FFFFFF; --ink:#0B1B3F; --slate:#4A5878; --mist:#8C98B2; --line:#DCE3F1;
  --orange:#E8650A; --orange-soft:#FFF1E6; --blue:#2F6BFF; --blue-soft:#E9F0FF; --good:#14804A; --good-soft:#E6F5EC; --bad:#B4233C; --bad-soft:#FCEBEE;
  --amber:#8A5A00; --amber-soft:#FFF4D6; --amber-line:#F0CF7A;
  --display:'Montserrat','Segoe UI',Arial,sans-serif; --body:'Inter','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
button,input{font:inherit}
.shell{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{width:50px;height:50px;object-fit:contain}
.brand h1{font:800 18px/1.2 var(--display);margin:0}
.brand p{margin:0;color:var(--slate);font-size:13px}
.prog{margin-left:auto;display:flex;align-items:center;gap:12px;flex:1;min-width:220px;max-width:460px;font-size:13px;color:var(--slate);font-variant-numeric:tabular-nums}
.bar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#D93A5B);transition:width .5s ease}
.main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}
nav{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 8px;position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 40px);overflow:auto}
nav h2{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mist);margin:12px 10px 6px}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.mi{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px;cursor:pointer}
.mi:hover{background:var(--blue-soft)} .mi:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.mi .n{font:700 12px var(--display);width:22px;color:var(--mist);font-variant-numeric:tabular-nums}
.mi .t{flex:1;min-width:0}
.mi .s{font-size:12px;color:var(--mist);white-space:nowrap}
.mi.on{background:var(--blue-soft);color:var(--blue);font-weight:600} .mi.on .n{color:var(--blue)}
.mi.done .s{color:var(--good)}
.page{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:560px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.ph{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph .eyebrow{margin:0}
.dots{margin-left:auto;display:flex;gap:6px}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)} .dots i.on{background:var(--orange)} .dots i.seen{background:#F6B98C}
.body{padding:28px 30px;flex:1;min-width:0}
.foot{padding:14px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow{font:700 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin:0 0 8px}
h2.title{font:900 clamp(22px,2.6vw,34px)/1.15 var(--display);margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
.lead{font-size:17px;color:var(--slate);max-width:68ch;margin:0 0 18px}
.lead b{color:var(--ink)}
.sample{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.tbc{margin-top:18px;padding:12px 16px;border-radius:12px;background:var(--amber-soft);border:1px dashed var(--amber-line);color:var(--amber);font-size:14px}
.tbc b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:760px}
.checklist li{display:flex;gap:14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#FBFCFF;opacity:0;transform:translateY(8px);animation:rise .5s ease forwards}
.checklist li svg{flex:none}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.checklist li{animation:none;opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rc{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:8px;min-height:116px}
.rc:hover{border-color:var(--blue)} .rc:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.rc .k{font:800 13px var(--display);color:var(--orange)}
.rc .h{font:800 17px/1.25 var(--display)}
.rc .hint{margin-top:auto;font-size:12.5px;color:var(--blue);font-weight:600}
.rc.open{border-color:var(--good);background:var(--good-soft)} .rc.open .hint{color:var(--good)}
.reveal{margin-top:14px;padding:16px 18px;border-radius:14px;background:var(--blue-soft);min-height:60px}
.reveal h4{font:800 17px var(--display);margin:0 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reveal p{margin:0 0 6px;color:var(--slate)} .reveal ul,.reveal ol{margin:6px 0 0;padding-left:20px;color:var(--ink)} .reveal li{margin:3px 0}
.shifts{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.shift{border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;background:#fff;min-width:220px}
.shift b{display:block;font:900 24px var(--display);font-variant-numeric:tabular-nums} .shift span{font-size:13px;color:var(--slate)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin-top:6px}
.flow div{flex:1 1 150px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-weight:600;font-size:14px;position:relative}
.flow div b{display:block;font:800 12px var(--display);color:var(--orange);margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.mail{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.mail code{font:600 14px ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1px solid var(--line);padding:4px 8px;border-radius:8px;user-select:all;word-break:break-all}
.cp{all:unset;cursor:pointer;font:700 12px var(--body);color:var(--blue);padding:4px 8px;border-radius:8px;border:1px solid #C9D8FF;background:#fff}
.cp:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.lbl{font-size:12px;color:var(--mist);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.btn{all:unset;box-sizing:border-box;font:700 14px var(--display);padding:11px 18px;border-radius:10px;cursor:pointer;background:var(--ink);color:#fff;text-align:center}
.btn:hover{background:#1A2F60} .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.35;cursor:not-allowed} .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.q{max-width:760px}
.q h3{font:800 20px/1.3 var(--display);margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff}
.opt b{font:800 13px var(--display);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.opt:hover{border-color:var(--blue)} .opt:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right b{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong b{background:var(--bad);color:#fff}
.fb{margin:12px 0 0;padding:11px 14px;border-radius:12px;font-size:14px}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.no{background:var(--bad-soft);color:var(--bad)}
.note{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-width:560px}
.note label{font-size:14px;font-weight:600}
.note input{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;color:var(--ink);background:#fff}
.note input:focus{outline:2px solid var(--blue);outline-offset:1px}
.video{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#F4F7FD;border:1px solid var(--line)}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.eco{width:100%;max-width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:8px}
.hm{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:6px}
.hm:hover{border-color:var(--blue)} .hm:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hm .k{font:800 12px var(--display);color:var(--mist);letter-spacing:.08em;text-transform:uppercase}
.hm .h{font:800 17px var(--display)} .hm .st{font-size:13px;color:var(--mist)} .hm.done .st{color:var(--good);font-weight:600}
.cert{text-align:center;border:2px solid var(--orange-soft);background:linear-gradient(160deg,#fff,#FFF8F2);border-radius:18px;padding:28px;max-width:720px;margin:0 auto}
.cert .who{font:900 clamp(24px,3vw,36px) var(--display);margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.stats div{background:var(--ground);border-radius:12px;padding:10px}
.stats b{display:block;font:800 19px var(--display);font-variant-numeric:tabular-nums} .stats span{font-size:12px;color:var(--slate)}
@media (max-width:920px){.main{grid-template-columns:minmax(0,1fr)} nav{position:static;max-height:280px}}
@media (max-width:600px){.body{padding:20px 16px}.ph,.foot{padding:12px 16px}.steps3{grid-template-columns:minmax(0,1fr)}.dots{display:none}.prog{flex-basis:100%;max-width:none;min-width:0}.stats{grid-template-columns:minmax(0,1fr)}}
.prog .scorechip{flex:none}
.scorechip{display:inline-flex;align-items:center;gap:6px;background:var(--orange-soft);border:1px solid #F6C9A5;border-radius:999px;padding:5px 12px;font:800 14px var(--display);color:var(--orange);font-variant-numeric:tabular-nums;white-space:nowrap}
.scorechip.bump{animation:bump .6s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.qhead{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qtype{font:700 12px var(--body);color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:4px 10px}
.pts{font:700 12px var(--body);color:var(--orange);background:var(--orange-soft);border-radius:999px;padding:4px 10px}
.qbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.qbtns:empty{display:none}
.hintline{color:var(--mist);font-size:13px;margin:0 0 10px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)} .opt.sel b{background:var(--blue);color:#fff}
.opt[disabled]{cursor:default}
.ord{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;max-width:760px}
.ord li{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.ord .num{font:800 14px var(--display);color:var(--orange);width:20px;font-variant-numeric:tabular-nums}
.ord .t{flex:1}
.ord button{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1.5px solid var(--line);font-weight:800;color:var(--ink);background:#fff}
.ord button:hover{border-color:var(--blue)} .ord button:focus-visible{outline:2px solid var(--blue)} .ord button[disabled]{opacity:.3;cursor:default}
.ord li.right{border-color:var(--good);background:var(--good-soft)} .ord li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 16px;max-width:900px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;display:flex;gap:10px;align-items:center;min-height:56px;font-size:14px;word-break:break-word}
.mt:hover{border-color:var(--blue)} .mt:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mt .tag{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 12px var(--display);color:#fff;background:#C9D2E6}
.mt.act{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.mt.right{border-color:var(--good);background:var(--good-soft)} .mt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.sorter{display:flex;flex-direction:column;gap:10px;max-width:900px}
.sc{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.sc p{margin:0 0 8px;font-weight:600}
.bins{display:flex;flex-wrap:wrap;gap:6px}
.bin{all:unset;box-sizing:border-box;cursor:pointer;font:600 13px var(--body);padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;min-height:36px}
.bin:hover{border-color:var(--blue)} .bin:focus-visible{outline:2px solid var(--blue)} .bin.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sc.right{border-color:var(--good);background:var(--good-soft)} .sc.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:780px}
.card{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:4/3;perspective:700px;display:block}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:14px}
.card .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s ease;transform-style:preserve-3d}
.card.up .in,.card.got .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;text-align:center;padding:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font:700 14px/1.25 var(--display)}
.card .f{background:linear-gradient(140deg,var(--ink),#1F3F86);color:#fff;font:900 22px var(--display);letter-spacing:.04em}
.card .b{background:#fff;border:1.5px solid var(--line);transform:rotateY(180deg);color:var(--ink)}
.card.got .b{border-color:var(--good);background:var(--good-soft)}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 18px;max-width:760px} .timer i{display:block;height:100%;background:var(--orange);width:100%;transition:width .2s linear}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 14px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#FFF7DD;border:1.5px solid #E3B341;color:#6B4A00;font:700 13px var(--body)}
.rank{display:inline-block;margin:6px 0 2px;padding:6px 16px;border-radius:999px;font:800 15px var(--display);color:#fff}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.3}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.card .in{transition:none}.scorechip.bump{animation:none}}
@media (max-width:600px){.mem{grid-template-columns:repeat(2,minmax(0,1fr))}.match{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 8px}.mt{font-size:13px;padding:8px}}
.cpbox{margin-top:12px;border:2px solid var(--orange);border-radius:14px;padding:16px 18px;background:var(--orange-soft)}
.cpbox h3{font:800 18px/1.3 var(--display);margin:0 0 12px}
.missions{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:780px}
.msn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:52px}
.msn:hover{border-color:var(--blue)} .msn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.msn .box{width:26px;height:26px;border-radius:8px;border:2px solid #C9D2E6;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.msn span:nth-child(2){flex:1}
.msn.on{border-color:var(--good);background:var(--good-soft)} .msn.on .box{background:var(--good);border-color:var(--good)}
.lb{margin-top:22px;border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:#FBFCFF;max-width:720px;margin-inline:auto}
.lb h3{font:800 18px var(--display);margin:0 0 10px}
.lb ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.lb li.me{border-color:var(--orange);background:var(--orange-soft)}
.lb .r{font:800 14px var(--display);width:22px;color:var(--orange);font-variant-numeric:tabular-nums}
.lb .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .p{font:800 14px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.vwrap{position:relative}
.ov{position:absolute;inset:0;border-radius:14px;background:rgba(11,27,63,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:3%;z-index:2;overflow:auto;animation:ovin .35s ease}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.ovin{width:100%;max-width:860px;color:#fff;text-align:center}
.ovk{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:#FFC79E;margin:0 0 6px}
.ovin h3{font:800 clamp(18px,2.2vw,26px)/1.25 var(--display);margin:0 0 16px;text-wrap:balance}
.ovopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ovo{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;border-radius:16px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);color:#fff;transition:transform .2s,background .2s;animation:pop .45s ease backwards}
.ovo:nth-child(2){animation-delay:.08s}.ovo:nth-child(3){animation-delay:.16s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.ovo:hover{background:rgba(255,255,255,.26);transform:translateY(-2px)} .ovo:focus-visible{outline:3px solid #FFC79E;outline-offset:2px}
.ovo span:not(.ovic){font:800 16px/1.25 var(--display)} .ovo small{font-size:12px;opacity:.8}
.ovo.seen{border-color:#7BD9A6;background:rgba(20,128,74,.28)}
.ovic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--blue);flex:none}
.ovc{all:unset;cursor:pointer;margin-top:16px;font:700 14px var(--body);color:#fff;text-decoration:underline;text-underline-offset:3px;padding:8px}
.ovc:focus-visible{outline:2px solid #FFC79E}
.ovinfo{background:#fff;color:var(--ink);border-radius:16px;padding:20px 22px;text-align:left;max-width:640px;animation:pop .35s ease}
.ovinfo .ovh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}.ovinfo h3{margin:0;font-size:20px}

const PTS={mc:10,tf:10,multi:20,order:20,match:20,sort:30,mem:30};
const TL={mc:'Multiple choice',tf:'True or false',multi:'Select all that apply',order:'Put in order',match:'Match the pairs',sort:'Sort the requests',mem:'Memory match'};
const P=it=>it.p||PTS[it.t];
const maxOf=m=>(m.quiz||[]).reduce((a,it)=>a+P(it),0);
const earnedOf=m=>(m.quiz||[]).reduce((a,it,i)=>a+(st.pts[m.id+'-'+i]||0),0);
const perfect=m=>!!m.quiz&&m.quiz.every((it,i)=>st.pts[m.id+'-'+i]===P(it));
function score(){let c=0,t=0;MODS.forEach(m=>{c+=earnedOf(m);t+=maxOf(m)});return{c,t,b:bonusOf(),pct:t?Math.round(c/t*100):0}}
function showScore(b){const s=score();$('scoreTxt').textContent=s.c+s.b;postScore();if(b){const c=$('scoreChip');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}}
function seedShuf(arr,seed){const a=arr.map((x,i)=>[x,i]);let s=7;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;for(let i=a.length-1;i>0;i--){s=(s*1103515245+12345)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}if(a.length>1&&a.every((x,i)=>x[1]===i))a.push(a.shift());return a}

function confetti(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}const c=document.createElement('div');c.className='confetti';const cols=['#E8650A','#2F6BFF','#14804A','#F6B98C','#0B1B3F'];
  c.innerHTML=Array.from({length:70},(_,i)=>`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${cols[i%5]};animation-delay:${(Math.random()*.5).toFixed(2)}s;animation-duration:${(1.2+Math.random()).toFixed(2)}s"></i>`).join('');document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}

function renderQuiz(m,qi){const it=m.quiz[qi],key=m.id+'-'+qi,p=P(it),N=m.quiz.length;let fails=0,reveal=()=>{};
  const got=st.pts[key];
  body.innerHTML=`<div class="q"><p class="eyebrow">Activity ${qi+1} of ${N}</p><div class="qhead"><span class="qtype">${TL[it.t]}</span><span class="pts" id="ptag">${got===undefined?p+' points':'Earned '+got+' of '+p+' points'}</span></div><h3>${it.q}</h3><div id="qa"></div><div class="qbtns" id="qbtns"></div><p class="fb" id="fb" hidden></p></div>`;
  const qa=$('qa'),btns=$('qbtns');$('next').disabled=!st.solved[key];
  const fb=(ok,msg)=>{const f=$('fb');f.hidden=false;f.className='fb '+(ok?'ok':'no');f.innerHTML=msg};
  const award=n=>{if(st.pts[key]===undefined){st.pts[key]=n;save();$('ptag').textContent='Earned '+n+' of '+p+' points';showScore(n>0)}};
  const solve=()=>{st.solved[key]=1;save();$('next').disabled=false;const r=$('reveal');if(r)r.remove()};
  const win=(n,msg)=>{const first=st.pts[key]===undefined;award(n);solve();fb(true,`<b>${msg||(first&&n?`Correct! +${n} points.`:'Correct.')}</b> ${it.why||''}`)};
  const lose=(msg,part=0)=>{const first=st.pts[key]===undefined;award(part);fails++;fb(false,(first&&part?`<b>+${part} points for the parts you got right.</b> `:'')+(msg||'Not quite. Try again.'));if(fails>=2&&!$('reveal')&&!st.solved[key])addReveal()};
  const addReveal=()=>{const b=document.createElement('button');b.className='btn ghost';b.id='reveal';b.textContent='Show the answer';b.onclick=()=>{award(0);reveal();solve();fb(true,'<b>Here is the answer.</b> '+(it.why||''))};btns.appendChild(b)};
  const submit=(label,fn)=>{const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=fn;btns.appendChild(b)};
  const done=()=>{if(st.solved[key]){reveal();fb(true,'<b>Completed.</b> '+(it.why||''))}};
  if(it.t==='mc'||it.t==='tf'){const o=it.t==='tf'?['True','False']:it.o,a=it.t==='tf'?(it.a?0:1):it.a;
    qa.innerHTML=`<div class="opts">${o.map((t,i)=>`<button class="opt" data-i="${i}"><b>${'ABCD'[i]}</b>${t}</button>`).join('')}</div>`;
    reveal=()=>qa.querySelectorAll('.opt')[a].classList.add('right');done();
    qa.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;qa.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));const ok=+b.dataset.i===a;b.classList.add(ok?'right':'wrong');ok?win(p):lose()};return}
  if(it.t==='multi'){const sel=new Set();
    qa.innerHTML=`<div class="opts">${it.o.map((t,i)=>`<button class="opt" data-i="${i}" aria-pressed="false"><b>${'ABCDEF'[i]}</b>${t}</button>`).join('')}</div>`;
    reveal=()=>qa.querySelectorAll('.opt').forEach((x,i)=>{x.classList.remove('wrong','sel');x.classList.toggle('right',it.a.includes(i))});done();
    qa.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel',sel.has(i));b.setAttribute('aria-pressed',sel.has(i));b.classList.remove('right','wrong')};
    submit('Check answer',()=>{if(!sel.size){fb(false,'Select at least one option.');return}
      const ok=sel.size===it.a.length&&it.a.every(i=>sel.has(i));qa.querySelectorAll('.opt').forEach((x,i)=>{x.classList.remove('right','wrong');if(sel.has(i))x.classList.add(it.a.includes(i)?'right':'wrong')});
      ok?win(p):lose([...sel].some(i=>!it.a.includes(i))?'Not quite. Some of your choices are wrong. Try again.':'Not quite. You missed at least one correct option. Try again.')});return}
  if(it.t==='order'){let cur=seedShuf(it.o,key).map(x=>x[1]);
    const draw=marks=>{qa.innerHTML=`<ol class="ord">${cur.map((oi,pos)=>`<li class="${marks?(oi===pos?'right':'wrong'):''}"><span class="num">${pos+1}</span><span class="t">${it.o[oi]}</span><button data-u="${pos}" aria-label="Move up"${pos===0?' disabled':''}>↑</button><button data-d="${pos}" aria-label="Move down"${pos===cur.length-1?' disabled':''}>↓</button></li>`).join('')}</ol>`};
    draw();reveal=()=>{cur=it.o.map((_,i)=>i);draw(true)};done();
    qa.onclick=e=>{const u=e.target.closest('[data-u]'),d=e.target.closest('[data-d]');if(u){const k=+u.dataset.u;[cur[k-1],cur[k]]=[cur[k],cur[k-1]];draw()}if(d){const k=+d.dataset.d;[cur[k+1],cur[k]]=[cur[k],cur[k+1]];draw()}};
    submit('Check order',()=>{const n=cur.filter((oi,pos)=>oi===pos).length;draw(true);n===cur.length?win(p):lose(`${n} of ${cur.length} are in the right place. Try again.`,Math.round(p*n/cur.length/2))});return}
  if(it.t==='match'){const R=seedShuf(it.r,key+'r');let pair={},act=null;const COL=['#2F6BFF','#E8650A','#14804A','#8A3FD1','#B4233C','#0F8A9D'];
    const draw=marks=>{qa.innerHTML=`<p class="hintline">Select an item on the left, then its match on the right.</p><div class="match"><div class="col">${it.l.map((t,i)=>{const pd=pair[i]!==undefined;return `<button class="mt${act===i?' act':''}${marks&&pd?(pair[i]===i?' right':' wrong'):''}" data-l="${i}"><span class="tag" style="${pd||act===i?'background:'+COL[i%6]:''}">${i+1}</span><span>${t}</span></button>`}).join('')}</div><div class="col">${R.map(([t,ri])=>{const li=Object.keys(pair).find(k=>pair[k]===ri);return `<button class="mt${marks&&li!==undefined?(+li===ri?' right':' wrong'):''}" data-r="${ri}"><span class="tag" style="${li!==undefined?'background:'+COL[li%6]:''}">${li!==undefined?+li+1:''}</span><span>${t}</span></button>`}).join('')}</div></div>`};
    draw();reveal=()=>{it.l.forEach((_,i)=>pair[i]=i);act=null;draw(true)};done();
    qa.onclick=e=>{const l=e.target.closest('[data-l]'),r=e.target.closest('[data-r]');
      if(l){const i=+l.dataset.l;if(act===i)act=null;else{delete pair[i];act=i}draw()}
      else if(r){if(act===null){fb(false,'Select an item on the left first.');return}const ri=+r.dataset.r;for(const k in pair)if(pair[k]===ri)delete pair[k];pair[act]=ri;act=null;$('fb').hidden=true;draw()}};
    submit('Check matches',()=>{if(Object.keys(pair).length<it.l.length){fb(false,'Match every item first.');return}const n=it.l.filter((_,i)=>pair[i]===i).length;draw(true);n===it.l.length?win(p):lose(`${n} of ${it.l.length} matches are right. Fix the red ones and try again.`,Math.round(p*n/it.l.length/2))});return}
  if(it.t==='sort'){const ch={};
    const draw=marks=>{qa.innerHTML=`<div class="sorter">${it.items.map(([t,b],i)=>`<div class="sc${marks&&ch[i]!==undefined?(ch[i]===b?' right':' wrong'):''}"><p>${t}</p><div class="bins">${it.bins.map((bn,j)=>`<button class="bin${ch[i]===j?' on':''}" data-i="${i}" data-j="${j}" aria-pressed="${ch[i]===j}">${bn}</button>`).join('')}</div></div>`).join('')}</div>`};
    draw();reveal=()=>{it.items.forEach(([,b],i)=>ch[i]=b);draw(true)};done();
    qa.onclick=e=>{const b=e.target.closest('.bin');if(!b)return;ch[+b.dataset.i]=+b.dataset.j;draw()};
    submit('Check answers',()=>{if(Object.keys(ch).length<it.items.length){fb(false,'Choose a team for every request first.');return}const n=it.items.filter(([,b],i)=>ch[i]===b).length;draw(true);n===it.items.length?win(p):lose(`${n} of ${it.items.length} are right. Fix the red ones and try again.`,Math.round(p*n/it.items.length/2))});return}
  if(it.t==='mem'){const cards=seedShuf(it.pairs.flatMap((pr,i)=>[[pr[0],i],[pr[1],i]]),key).map(x=>x[0]);let up=[],found=new Set(),miss=0,lock=false;
    qa.innerHTML=`<p class="hintline">Flip two cards at a time to find each matching pair. Mistakes: <b id="miss">0</b></p><div class="mem">${cards.map(([t],i)=>`<button class="card" data-i="${i}" aria-label="Hidden card"><span class="in"><span class="f">B11</span><span class="b">${t}</span></span></button>`).join('')}</div>`;
    const els=[...qa.querySelectorAll('.card')];
    reveal=()=>els.forEach((el,i)=>{el.classList.add('got');el.setAttribute('aria-label',cards[i][0])});done();
    qa.onclick=e=>{const el=e.target.closest('.card');if(!el||lock||st.solved[key])return;const i=+el.dataset.i;if(up.includes(i)||found.has(cards[i][1]))return;
      el.classList.add('up');el.setAttribute('aria-label',cards[i][0]);up.push(i);if(up.length<2)return;
      const [x,y]=up;if(cards[x][1]===cards[y][1]){found.add(cards[x][1]);els[x].classList.add('got');els[y].classList.add('got');up=[];
        if(found.size===it.pairs.length){const n=miss<=2?p:miss<=5?Math.round(p*.66):Math.round(p*.33);const first=st.pts[key]===undefined;award(n);solve();fb(true,`<b>All pairs found${first?`! +${n} points`:''}.</b> ${miss} mistake${miss===1?'':'s'}. ${it.why||''}`)}}
      else{miss++;$('miss').textContent=miss;lock=true;setTimeout(()=>{els[x].classList.remove('up');els[y].classList.remove('up');els[x].setAttribute('aria-label','Hidden card');els[y].setAttribute('aria-label','Hidden card');up=[];lock=false},900)}};return}
}

function speedIntro(){body.innerHTML=`<p class="eyebrow">Bonus challenge</p><h2 class="title">Speed round</h2><p class="lead">Answer as many questions as you can in 60 seconds. Each correct answer earns <b>5 bonus points</b>. ${st.speed?`Your best so far is <b>${st.speed} points</b>.`:''}</p><div class="qbtns"><button class="btn" id="go">Start the speed round</button></div><p class="hintline" style="margin-top:12px">It is optional: select Next to skip it.</p>`;$('go').onclick=speedRun}
function speedRun(){const pool=[];MODS.forEach(m=>(m.quiz||[]).forEach(it=>{if(it.t==='mc'||it.t==='tf')pool.push(it)}));pool.sort(()=>Math.random()-.5);
  let i=0,pts=0,over=false;const end=Date.now()+60000;
  const tick=()=>{const left=Math.max(0,end-Date.now());const b=$('tbar'),tt=$('tt');if(b)b.style.width=(left/600)+'%';if(tt)tt.textContent=Math.ceil(left/1000)+'s';if(left<=0)finishRun()};
  const show=()=>{if(over)return;if(i>=pool.length){finishRun();return}const it=pool[i];const o=it.t==='tf'?['True','False']:it.o;const a=it.t==='tf'?(it.a?0:1):it.a;
    body.innerHTML=`<p class="eyebrow">Speed round · <span id="tt">60s</span> left · <span id="sp">${pts}</span> bonus points</p><div class="timer"><i id="tbar"></i></div><div class="q"><h3>${it.q}</h3><div class="opts">${o.map((t,k)=>`<button class="opt" data-i="${k}"><b>${'ABCD'[k]}</b>${t}</button>`).join('')}</div></div>`;tick();
    body.querySelector('.opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||over)return;const ok=+b.dataset.i===a;if(ok)pts+=5;b.classList.add(ok?'right':'wrong');if(!ok)body.querySelectorAll('.opt')[a].classList.add('right');body.querySelectorAll('.opt').forEach(x=>x.disabled=true);setTimeout(()=>{i++;show()},ok?450:900)}};
  const finishRun=()=>{if(over)return;over=true;clearInterval(T);T=null;const best=pts>(st.speed||0);if(best){st.speed=pts;save();showScore(true)}
    body.innerHTML=`<p class="eyebrow">Speed round complete</p><h2 class="title">${pts} bonus points</h2><p class="lead">You answered ${Math.min(i,pool.length)} question${i===1?'':'s'}. ${best&&pts?'That is your best score so far, and it has been added to your total.':`Your best score is ${st.speed||0} points.`}</p><div class="qbtns"><button class="btn ghost" id="go">Play again</button></div>`;$('go').onclick=speedRun;if(best&&pts>=30)confetti()};
  clearInterval(T);T=setInterval(tick,200);show()}

  if(stp.k==='cards'){body.innerHTML=head+(stp.sample?`<p>${SAMPLE}</p>`:'')+`<div class="cards" data-r="1"${stp.cols3?' style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))"':''}>${stp.cards.map(([k,h],j)=>`<button class="rc" data-j="${j}">${k?`<span class="k">${k}</span>`:''}<span class="h">${h}</span><span class="hint">Select to open</span></button>`).join('')}</div><div class="reveal" data-r="1" hidden></div>${stp.after||''}${stp.tbc?tbc(stp.tbc):''}`;wireCards(stp);return}
  if(stp.k==='html'){body.innerHTML=head+stp.html+(stp.tbc?tbc(stp.tbc):'');wireCopy(body);return}
  if(stp.k==='bu'){body.innerHTML=head+`<p class="lead">Select your assigned business unit to see the topics in its learning path.</p><div class="cards">${BU.map(([n],j)=>`<button class="rc${st.bu===n?' open':''}" data-j="${j}"><span class="h">${n}</span><span class="hint">${st.bu===n?'✓ Selected':'Select'}</span></button>`).join('')}</div><div class="reveal" id="buOut" hidden></div>`;
    const show=j=>{const [n,t]=BU[j];$('buOut').hidden=false;$('buOut').innerHTML=`<h4>${n} learning path <span class="sample">Awaiting business-unit content</span></h4><ul>${t.map(x=>`<li>${x}</li>`).join('')}</ul>`};
    if(st.bu)show(BU.findIndex(b=>b[0]===st.bu));
    body.querySelector('.cards').addEventListener('click',e=>{const c=e.target.closest('.rc');if(!c)return;const j=+c.dataset.j;st.bu=BU[j][0];save();body.querySelectorAll('.rc').forEach(x=>{x.classList.remove('open');x.querySelector('.hint').textContent='Select'});c.classList.add('open');c.querySelector('.hint').textContent='✓ Selected';show(j)});return}
  if(stp.k==='team'){body.innerHTML=head+`<p class="lead">Every employee should understand who they report to, who their team members are, which functions they work with, who approves their work and where to escalate a concern. Note yours below for quick reference.</p>${TEAM.map(([id,l])=>`<div class="note"><label for="n-${id}">${l}</label><input id="n-${id}" value="${esc(st.notes[id]||'').replace(/"/g,'&quot;')}" placeholder="Add a note"></div>`).join('')}<p class="note" style="color:var(--mist);font-size:13px">Your notes stay on this device${API?' and in your learning record':''}.</p>`;
    TEAM.forEach(([id])=>$('n-'+id).addEventListener('input',e=>{st.notes[id]=e.target.value;save()}));return}
  if(stp.k==='speed'){speedIntro();return}
  if(stp.k==='missions'){missions();return}
  if(stp.k==='finish'){finish();return}}
function finish(){const left=REQ.filter(m=>!st.done[m.id]);$('crumb').textContent=PARTS[5];
  if(left.length){body.innerHTML=`<p class="eyebrow">Almost there</p><h2 class="title">Complete the remaining modules to finish.</h2><div class="cards">${left.map(m=>`<button class="rc" data-k="${MODS.indexOf(m)}"><span class="h">${m.t}</span><span class="hint">Go to module</span></button>`).join('')}</div>`;
    body.querySelector('.cards').addEventListener('click',e=>{const c=e.target.closest('.rc');if(c)open(+c.dataset.k,0)});return}
  if(st.done.fin){cert();return}
  body.innerHTML=`<p class="eyebrow">You’re ready to get started</p><h2 class="title">You’re ready to get started.</h2><p class="lead">You now know the basics of working at B11, the tools used in your daily routine, the support channels available and where to find important employee information.</p>
  <p class="lead" style="margin-bottom:8px"><b>Remember:</b></p><ul class="checklist">${['Follow the approved processes.','Use the right tools.','Reach out when you need support.','Keep learning about your role and business.'].map((t,i)=>`<li style="animation-delay:${i*.15}s">${tick}<span>${t}</span></li>`).join('')}</ul>
  <div class="note" style="margin-top:22px"><label for="nm">Your full name, for your completion record</label><input id="nm" autocomplete="name" value="${esc(st.name||'').replace(/"/g,'&quot;')}"></div><button class="btn" id="fin">Complete onboarding</button>`;
  const go=()=>{const v=$('nm').value.trim();if(!v){$('nm').focus();return}st.name=v;st.done.fin=1;st.when=new Date().toISOString();save();
    const s=score();if(API){try{API.LMSSetValue('cmi.core.score.min','0');API.LMSSetValue('cmi.core.score.max','100');API.LMSSetValue('cmi.core.score.raw',String(s.pct));API.LMSSetValue('cmi.core.lesson_status','completed');API.LMSCommit('')}catch(e){}}
    progress();refreshNav();cert()};
  $('fin').addEventListener('click',go);$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
function cert(){const s=score();const d=new Date(st.when||Date.now()).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
  const rk=s.pct>=90?['Gold','Onboarding Champion','#B8860B']:s.pct>=70?['Silver','Team Ready','#6E7C99']:['Bronze','Getting Started','#A0603A'];
  const bdg=MODS.filter(perfect).map(m=>'Perfect: '+m.t);if((st.speed||0)>=30)bdg.push('Speed Star');if(Object.keys(st.ms).length===MISSIONS.length)bdg.push('Mission Complete');if(Object.keys(CPS).every(k=>st.cp[k]===5))bdg.push('Sharp Eyes');if(Object.keys(EXP).every(k=>st.ex[k]&&Object.keys(st.ex[k]).length===EXP[k].o.length))bdg.push('Explorer');
  body.innerHTML=`<div class="cert"><img src="bxi.png" alt="B11 Technology" style="width:86px;height:86px;object-fit:contain"><p class="eyebrow" style="margin-top:8px">Onboarding complete</p><p style="margin:0">This certifies that</p><div class="who">${esc(st.name)}</div><p>has completed the B11 Technology Employee Onboarding on ${d}.</p>
  <span class="rank" style="background:${rk[2]}">${rk[0]} · ${rk[1]}</span>
  <div class="stats"><div><b>${s.c+s.b}</b><span>Total points${s.b?' (incl. '+s.b+' bonus)':''}</span></div><div><b>${s.pct}%</b><span>Activity score</span></div><div><b>${REQ.length} / ${REQ.length}</b><span>Modules completed</span></div><div><b>${esc(st.bu||'—')}</b><span>Business unit</span></div></div>
  ${bdg.length?`<p class="eyebrow" style="margin:0">Badges earned</p><div class="badges">${bdg.map(b=>`<span class="badge"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>${b}</span>`).join('')}</div>`:''}
  <h2 class="title" style="font-size:26px;margin-top:10px">WELCOME TO B11 TECHNOLOGY.</h2><p style="margin:0;color:var(--orange);font:800 18px var(--display)">Your journey starts here.</p><div class="qbtns" style="justify-content:center;margin-top:18px"><button class="btn" id="tomiss">First-week missions</button><button class="btn ghost" id="again">Restart onboarding</button></div></div>${boardHTML()}`;
  $('tomiss').onclick=()=>open(MODS.findIndex(m=>m.id==='ms'),0);
  if(!cert.shown){cert.shown=1;if(s.pct>=70)confetti()}
  $('again').addEventListener('click',()=>{st={m:null,s:0,done:{},pts:{},solved:{},speed:0,cp:{},ms:{},ex:{},bu:st.bu,notes:st.notes,name:st.name};save();render()})}

$('next').addEventListener('click',()=>{if(st.m===null){const nx=MODS.findIndex(m=>!st.done[m.id]);open(nx<0?MODS.length-1:nx,0);return}
  const m=MODS[st.m],n=stepsOf(m);if(st.s<n-1){st.s++;save();render();window.scrollTo({top:0,behavior:'smooth'});return}
  const was=st.done[m.id];st.done[m.id]=1;save();if(!was&&perfect(m))confetti();const nx=MODS.findIndex((x,k)=>k>st.m&&!st.done[x.id]);open(nx<0?MODS.length-1:nx,0)});
$('back').addEventListener('click',()=>{if(st.m===null)return;if(st.s>0){st.s--;save();render()}else{st.m=null;save();render()}});
buildNav();render();
})();
</script>
</body></html>
